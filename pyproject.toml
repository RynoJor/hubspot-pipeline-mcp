[project]
name = "hubspot-pipeline-mcp"
version = "0.1.0"
description = "Ask Claude which deals are stuck: a read-only MCP server over the HubSpot CRM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryno Jordaan" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hubspot-pipeline-mcp = "hubspot_pipeline_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubspot_pipeline_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
